# Test every push and pull request. On main: build images, push them to GHCR, and deploy to EC2.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    name: Build and push images
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image names (GHCR needs lowercase)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-app:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-app:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to EC2
    needs: build
    # Turned on by the repository variable DEPLOY_ENABLED=true once the server and secrets exist.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      DEPLOY_PATH: support-box # relative to the SSH user's home directory
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Prefer a pinned host key; fall back to scanning on first setup.
          if [ -n "$EC2_KNOWN_HOSTS" ]; then
            printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 15 -H "$EC2_HOST" > ~/.ssh/known_hosts
          fi
          cat >> ~/.ssh/config <<EOF
          Host ec2
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF

      - name: Copy deployment files
        run: |
          ssh ec2 "mkdir -p ~/$DEPLOY_PATH"
          scp docker-compose.yml docker-compose.prod.yml .env.example scripts/deploy.sh "ec2:~/$DEPLOY_PATH/"

      - name: Pull images and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Short-lived token, passed on stdin so it never appears in process lists or logs.
          printf '%s' "$GHCR_TOKEN" | ssh ec2 "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh ec2 "cd ~/$DEPLOY_PATH && chmod +x deploy.sh && IMAGE_PREFIX='ghcr.io/${GITHUB_REPOSITORY,,}' IMAGE_TAG='${{ github.sha }}' ./deploy.sh"
